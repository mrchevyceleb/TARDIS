name: Release

# Builds the native shells and attaches them to a GitHub Release.
#   - push a tag `v<version>` matching package.json to publish a release
#   - run manually (workflow_dispatch) to build artifacts without publishing

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Build jobs get a read-only token and no persisted credentials; only the
# publishing job may write to the repository.
permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      - name: Build the macOS control helper (universal)
        if: runner.os == 'macOS'
        working-directory: desktop/native
        run: |
          swiftc -O -swift-version 5 -target arm64-apple-macos14 macos.swift -o macos-helper-arm64
          swiftc -O -swift-version 5 -target x86_64-apple-macos14 macos.swift -o macos-helper-x64
          lipo -create macos-helper-arm64 macos-helper-x64 -output macos-helper
          rm macos-helper-arm64 macos-helper-x64
      - name: Require macOS signing on tagged releases
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::Tagged mac releases must be signed with the stable identity (CSC_LINK / CSC_KEY_PASSWORD secrets): an unsigned mac build wipes the mac's Screen Recording and Accessibility grants on every update."
            exit 1
          fi
      - name: Install the macOS signing identity
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "No CSC_LINK secret: this mac build stays unsigned (ad-hoc), as before."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/tardis-signing.keychain"
          printf '%s' "$CSC_LINK" | base64 -d > "$RUNNER_TEMP/sign.p12"
          # One password for both the keychain and the p12. electron-builder's
          # own CSC_LINK dance creates its temp keychain with a random password
          # and then unlocks it with the p12 password, and the mismatched
          # SecKeychainUnlock fails on this macOS, so the identity is installed
          # here instead and the build step below only names it.
          security create-keychain -p "$CSC_KEY_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$CSC_KEY_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security import "$RUNNER_TEMP/sign.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CSC_KEY_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/sign.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
      - name: Build installers
        run: npm run dist --prefix desktop
        env:
          # macOS builds sign with the stable self-signed identity, installed
          # into a temp keychain by the step above, so Screen Recording and
          # Accessibility grants survive every update. Windows and Linux
          # builds stay unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_NAME: ${{ runner.os == 'macOS' && secrets.CSC_LINK != '' && 'SamWise Self-Signed' || '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/out/*.exe
            desktop/out/*.dmg
            desktop/out/*.zip
            desktop/out/*.AppImage
            desktop/out/*.blockmap
            desktop/out/latest*.yml

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - name: Build the APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "Signing with the release key."
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # A runner-generated debug key changes every build, and phones refuse
            # updates signed by a different key. Never publish one.
            echo "::error::Tagged releases must be signed. Add the ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD secrets."
            exit 1
          else
            echo "No complete ANDROID_KEYSTORE_* secrets: signing this manual build with the debug key."
          fi
          ./gradlew --no-daemon :app:assembleRelease
          VERSION=$(node -p "require('../package.json').version")
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/TARDIS-$VERSION-android.apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          if-no-files-found: error
          path: android/out/*.apk

  release:
    name: Publish release
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-files
          merge-multiple: true
      - run: ls -la release-files
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: TARDIS ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-files/*
