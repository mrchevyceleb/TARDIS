name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run deadcode
      - run: npm run build
      - name: Validate optional Jarvis agent
        run: |
          npm ci --prefix jarvis-agent
          npm audit --prefix jarvis-agent --audit-level=high
          npm run typecheck --prefix jarvis-agent
          npm test --prefix jarvis-agent

  shells:
    name: Native shells
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      - run: npm audit --prefix desktop --audit-level=high
      - run: npm run typecheck --prefix desktop
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - name: Compile the Android shell
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

  macos-helper:
    name: macOS helper
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile the helper for both Mac architectures
        working-directory: desktop/native
        run: |
          swiftc -O -swift-version 5 -target arm64-apple-macos14 macos.swift -o /tmp/macos-helper-arm64
          swiftc -O -swift-version 5 -target x86_64-apple-macos14 macos.swift -o /tmp/macos-helper-x64

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan the full Git history
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            detect --source=/repo --config=/repo/.gitleaks.toml --log-opts=--all --redact=100 --no-banner
