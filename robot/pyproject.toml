[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tardis-robot"
version = "0.1.0"
description = "TARDIS robot companion: gives a desk robot to the ship's companions as a body."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "websockets>=12,<15",
  "numpy>=1.24",
]

[project.optional-dependencies]
# Live voice through Jarvis (LiveKit room + local audio I/O).
voice = [
  "livekit>=1.0.0",
  "sounddevice>=0.4.6",
]
# On-device wake word ("hey jarvis") for hands-free summons.
wake = [
  "openwakeword>=0.6.0",
  "onnxruntime>=1.16",
]

[project.scripts]
tardis-robot = "tardis_robot.__main__:main"

[tool.setuptools.packages.find]
include = ["tardis_robot*"]
