[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tardis-robot"
version = "0.1.0"
description = "TARDIS robot companion: gives a desk robot to the ship's companions as a body."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "websockets>=12,<15",
  # <2 so the venv (created with --system-site-packages) keeps the system
  # numpy that the preinstalled OpenCV was built against; numpy 2.x shadows it
  # and breaks `import cv2` (numpy.core.multiarray failed to import).
  "numpy>=1.24,<2",
]

[project.optional-dependencies]
# Voice: a Grok realtime call over the ship's /ws/voice socket plus an on-device
# "hey spark" wake word. Local audio I/O (sounddevice) and an offline recognizer
# (vosk); the call transport is plain websockets (a core dependency). Vosk needs
# no numpy>=1.26, so it coexists with the preinstalled OpenCV the camera uses.
voice = [
  "sounddevice>=0.4.6",
  "vosk>=0.3.44",
]

[project.scripts]
tardis-robot = "tardis_robot.__main__:main"

[tool.setuptools.packages.find]
include = ["tardis_robot*"]
